apis:
- aid: pvcase-prospect-api
  name: PVcase Prospect API (Anderson Optimization API)
  description: >-
    Beta REST API for PVcase Prospect, published as the "Anderson Optimization API"
    (OpenAPI 3.0.3, version 1.0.0-beta) in the PVcase Prospect documentation. It exposes
    teams, companies, projects and geospatial assets (land parcels, substations,
    transmission lines) including bulk query endpoints and XYZ vector-tile endpoints,
    authenticated with HTTP Basic using an AO username and API token. PVcase documents
    it as a "Future Offering" available to enterprise customers.
  humanURL: https://pvcase-prospect.gitbook.io/pvcase-prospect-user-documentation/prospect/advanced-tools/api-future-offering
