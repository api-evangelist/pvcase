aid: pvcase
name: PVcase
description: >-
  PVcase is a Lithuanian solar engineering software company building an end-to-end
  platform for utility-scale and commercial photovoltaic project development, covering
  site prospecting, land and grid screening, ground-mount and roof-mount PV layout
  design, terrain-aware engineering and energy yield simulation. Its product family
  includes PVcase Prospect (site selection, parcel and landowner data, interconnection
  capacity and buildable-area analysis, built on the Anderson Optimization platform it
  acquired in June 2023), PVcase Ground Mount and Roof Mount (AutoCAD-based PV layout
  design), and PVcase Yield (energy simulation). The developer surface is narrow and
  early: a beta REST API for PVcase Prospect, documented under "Advanced tools" in the
  Prospect GitBook documentation as an Anderson Optimization API with an OpenAPI 3.0.3
  description covering teams, projects and geospatial assets, offered to enterprise
  customers alongside a read-only WMS layer and SSO.
