domain_standards:
  sector: energy / solar project development / geospatial
  searched:
  - id: ogc-wms
    conforms: partial
    evidence: >-
      The API technical overview advertises a "Read-only WMS layer" to display AO GIS data
      in other GIS systems in real time — an OGC Web Map Service surface. It is named in the
      prose but is NOT described in the OpenAPI contract, has no documented endpoint, and no
      GetCapabilities URL is published, so conformance cannot be verified from the contract.
      The related PVcase Prospect client consumes an OGC OWS endpoint at
      https://geoserver.prod.andersonopt.com/geoserver/AO/ows (GeoServer), which is
      application infrastructure rather than a published customer contract.
  - id: ogc-api-features
    conforms: false
    evidence: >-
      No /collections, /conformance or OGC API - Features landing page exists on any probed
      host.
  - id: xyz-vector-tiles
    conforms: true
    evidence: >-
      Eight operations expose the de-facto XYZ tile scheme
      (/api/{scope}/{id}/{assets|projects}/{z}/{x}/{y}); the Prospect client decodes them as
      Mapbox Vector Tiles. This is a de-facto convention, not a formal OGC standard, and the
      spec declares the media type as application/json rather than
      application/vnd.mapbox-vector-tile.
  - id: geojson-rfc7946
    conforms: unknown
    evidence: >-
      Geometry is carried inside anonymous def-N schemas; no GeoJSON media type or $ref to
      an RFC 7946 shape is declared, so it cannot be asserted from the contract.
  - id: iec-61970-cim
    conforms: false
    evidence: >-
      Grid assets (substation, transmission line) are modelled with a bespoke
      asset:network:* taxonomy rather than the IEC 61970 Common Information Model used for
      power-system data exchange.
  - id: sunspec
    conforms: false
    evidence: Not applicable — this is a design/siting API, not a device telemetry surface.
  note: >-
    Reward-only. The market's candidate standards for this surface are the OGC family (WMS,
