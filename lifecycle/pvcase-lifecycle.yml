decay_signals:
- signal: spec-server-host-does-not-resolve
  severity: high
  detail: >-
    The published OpenAPI declares servers[0].url =
    https://core-v1.carbon.prod.andersonopt.com. As probed on 2026-08-26 that hostname does
    not resolve (NXDOMAIN) — a client following the spec verbatim cannot connect. The live
    PVcase Prospect application configures its API against
    https://core-v2.prod.andersonopt.com, which does resolve.
  evidence:
    dig core-v1.carbon.prod.andersonopt.com: no answer
    dig core-v2.prod.andersonopt.com: 99.84.234.41 (and 3 more)
- signal: docs-base-url-does-not-resolve
  severity: high
  detail: >-
    The Quick Start page's curl/Node/Python samples all call
