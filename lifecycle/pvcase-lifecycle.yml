    not resolve either, so neither of the two published base URLs is reachable.
  evidence:
    dig api.andersonopt.com: no answer
- signal: base-url-disagreement
  severity: medium
  detail: >-
    The spec's servers[] host and the documentation's code samples name two different
    hosts (core-v1.carbon.prod.andersonopt.com vs api.andersonopt.com) with no note
    explaining the difference.
- signal: brand-lag
  severity: low
